[project]
name = "gcmarl"
version = "0.1.0"
description = "Goal-Conditioned Multi-Agent Reinforcement Learning"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Note: JAX with TPU support should be installed separately via:
    # uv pip install "jax[tpu]>=0.4.38" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
    # See setup_with_pyproject.sh for automated setup
    
    # ML frameworks
    "flax>=0.8.0",
    "optax>=0.2.0",
    "chex>=0.1.85",
    "distrax>=0.1.5",
    
    # Brax and environments
    "brax>=0.10.0",
    "dm-haiku>=0.0.11",
    "mujoco>=3.1.0",
    "mujoco-mjx>=3.1.0",
    "gymnax>=0.0.6",
    "warp",
    
    # Utilities
    "tyro>=0.9.0",
    "wandb>=0.17.0",
    "wandb-osh>=1.2.2",
    "matplotlib>=3.8.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0,<3.0.0",
    "mediapy>=1.2.0",
    "safetensors>=0.4.0",
    
    # Additional dependencies
    "tensorflow-probability>=0.25.0",
    "scikit-image>=0.23.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcmarl"]

[tool.uv]
# Use standard PyPI index, JAX TPU wheels will be installed separately
index-url = "https://pypi.org/simple"

