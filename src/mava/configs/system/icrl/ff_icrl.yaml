# --- FF-ICRL System Config ---

# Enable ICRL
use_icrl: true

# Seed
total_timesteps: ~ # Set the total environment steps.
num_updates: 1220 # Number of updates
seed: 42
# Training steps
explore_steps: 1000  
update_batch_size: 1
add_agent_id: True
num_eval_envs: 32
# Environment steps (Connector-specific)
rollout_length: 128 # Number of environment steps per vectorised environment.
eval_rollout_length: 128
episode_length: 101 # we uses timelimit instead of episode length
epochs: 1
policy_update_delay: 1

# Buffer (Connector-specific)
buffer_size: 5000  # Smaller buffer for smaller problem
batch_size: 256

num_minibatches: 1 # Number of minibatches per ppo epoch.

# Learning rates
policy_lr: 3e-4
q_lr: 3e-4
alpha_lr: 3e-4
max_grad_norm: 0.5

# Algorithm
tau: 0.005
gamma: 0.99

# Entropy tuning
autotune: true
target_entropy_scale: 0.5
init_alpha: 0.1

# ICRL-specific
logsumexp_penalty_coeff: 0.1
discrete_actions: false  # Use Gumbel-Softmax for discrete actions

goal_sampling:
  gamma_discount: 0.99
  use_future_mask: true

# and overwritten at runtime. They are provided here as documentation only.
icrl:
  learnable_temperature: true
  
  # Goal type for Connector (choose one):
  goal_type: "distance_per_agent"  # "total_distance" # "ratio_connected"
  
  obs_dim: null  
  goal_dim: null 
  goal_start_idx: null  
  goal_end_idx: null  

